services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: research_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: research_assistant
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_CHAT_COMPLETIONS_PATH: ${AI_CHAT_COMPLETIONS_PATH:-/chat/completions}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      AI_VECTORSTORE_TYPE: ${AI_VECTORSTORE_TYPE:-none}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDINGS_PATH: ${AI_EMBEDDINGS_PATH:-/embeddings}
      APP_STORAGE_ROOT: /app/storage
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/app/storage
    restart: unless-stopped

volumes:
  app-storage:
