server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:research_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: openai
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${AI_API_KEY:dummy-key}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        embeddings-path: ${AI_EMBEDDINGS_PATH:/v1/embeddings}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      type: ${AI_VECTORSTORE_TYPE:none}
      pgvector:
        initialize-schema: true
        dimensions: 1536
        table-name: vector_store

app:
  storage:
    root: ${APP_STORAGE_ROOT:./storage}
