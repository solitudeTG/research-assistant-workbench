<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/workbench.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">RW</div>
            <div>
                <h1>研究工作台</h1>
                <p id="project-summary">正在载入项目空间</p>
            </div>
        </div>
        <div class="topbar-status">
            <span id="system-status" class="status-pill" data-state="checking">连接中</span>
            <span id="active-project-chip" class="context-chip">项目未选择</span>
        </div>
    </header>

    <div class="workbench-layout">
        <aside class="left-column" data-region="left-project-sources" aria-label="项目、会话与资料">
            <section class="project-panel">
                <div class="section-heading">
                    <p>Project</p>
                    <h2 id="project-topic">项目空间</h2>
                </div>
                <p id="project-description" class="compact-text">选择或创建一个研究项目后，资料、会话和知识板会围绕该项目工作。</p>
                <dl class="project-stats">
                    <div>
                        <dt>资料</dt>
                        <dd id="stat-sources">0</dd>
                    </div>
                    <div>
                        <dt>知识</dt>
                        <dd id="stat-knowledge">0</dd>
                    </div>
                    <div>
                        <dt>会话</dt>
                        <dd id="stat-sessions">0</dd>
                    </div>
                </dl>
            </section>

            <section class="column-section">
                <div class="section-heading section-heading--inline">
                    <div>
                        <p>Sessions</p>
                        <h2>研究会话</h2>
                    </div>
                    <button id="new-session" class="quiet-button" type="button">新建</button>
                </div>
                <div id="session-list" class="stack-list" aria-live="polite"></div>
            </section>

            <section class="column-section">
                <div class="section-heading section-heading--inline">
                    <div>
                        <p>Sources</p>
                        <h2>资料库</h2>
                    </div>
                    <button id="refresh-sources" class="quiet-button" type="button">刷新</button>
                </div>
                <label class="source-import" for="file-input">
                    <span>导入论文或笔记</span>
                    <input id="file-input" type="file" accept=".pdf,.txt,.md,.doc,.docx">
                </label>
                <button id="upload-button" class="primary-button" type="button">写入项目资料库</button>
                <p id="source-count" class="micro-copy">资料状态会随 SSE 或轮询更新。</p>
                <div id="source-list" class="stack-list" aria-live="polite"></div>
            </section>
        </aside>

        <main class="center-column" data-region="center-research-dialogue" aria-label="多轮研究对话">
            <header class="dialogue-header">
                <div>
                    <p class="overline">Research dialogue</p>
                    <h2 id="active-session-title">多轮研究对话</h2>
                    <p id="active-session-meta">本地知识优先，证据不足时标记需要补充。</p>
                </div>
                <div id="answer-state" class="answer-state">等待问题</div>
            </header>

            <section id="conversation" class="conversation" aria-live="polite"></section>

            <section class="composer" aria-label="发送研究问题">
                <div class="composer-modes" aria-label="回答模式">
                    <label><input id="allow-web" type="checkbox" checked> 证据不足时联网补充</label>
                    <label><input id="extract-candidates" type="checkbox" checked> 回答后提炼候选</label>
                </div>
                <textarea id="composer" rows="4" placeholder="输入研究问题，例：这组资料支持哪些核心结论？"></textarea>
                <div class="composer-footer">
                    <span id="status-banner" class="micro-copy">工作台已就绪</span>
                    <button id="send-button" class="primary-button" type="button">发送问题</button>
                </div>
            </section>
        </main>

        <aside class="right-column" data-region="right-research-sidebar" aria-label="研究侧栏">
            <nav class="sidebar-tabs" aria-label="研究侧栏视图">
                <button class="tab-button is-active" type="button" data-sidebar-view="knowledge-board">知识板</button>
                <button class="tab-button" type="button" data-sidebar-view="evidence-sources">证据来源</button>
                <button class="tab-button" type="button" data-sidebar-view="candidate-confirmation">候选确认</button>
            </nav>

            <p id="answer-context-line" class="context-line">当前回答还没有关联证据或候选。</p>

            <section class="sidebar-view is-active" data-view="knowledge-board" aria-label="知识板">
                <div class="section-heading">
                    <p>Knowledge board</p>
                    <h2>长期研究知识</h2>
                </div>
                <div id="knowledge-board" class="knowledge-board"></div>
            </section>

            <section class="sidebar-view" data-view="evidence-sources" aria-label="证据来源">
                <div class="section-heading">
                    <p>Evidence</p>
                    <h2>证据来源</h2>
                </div>
                <div id="evidence-list" class="stack-list"></div>
            </section>

            <section class="sidebar-view" data-view="candidate-confirmation" aria-label="候选确认">
                <div class="section-heading">
                    <p>Candidates</p>
                    <h2>候选确认</h2>
                </div>
                <div id="candidate-list" class="stack-list"></div>
            </section>
        </aside>
    </div>
</div>

<script type="module" src="./js/workbench-app.js"></script>
</body>
</html>
